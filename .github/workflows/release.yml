name: Release

# Pushing a tag such as v0.3.0 publishes <id>-<version>.zip (and its .sha256) as a GitHub release.
# The tag must match the version in module.json. It is built against the core version in core-ref.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: Gamemode-Invasor/invasor/.github/workflows/module.yml@main
    with:
      release: true
      core-ref: v0.3.0
    secrets: inherit
